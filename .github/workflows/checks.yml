# The checks of AGENTS.md (RULE checks), called by ci.yml and by
# release.yml. `make build-windows` is the build of windows of build.yml.

name: checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: lavapipe, which draws the pictures of the tests (RULE test.picture.renderer)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
