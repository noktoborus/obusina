# The checks of checks.yml and the builds of build.yml, unsigned, on every
# push to a branch other than main and on every pull request. A push to main
# is checked and built by release.yml. Nothing is signed or published.

name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    uses: ./.github/workflows/build.yml
