# A release, on every push to main, named by the day of the push in UTC,
# YYYY.MM.DD: the checks of checks.yml; the builds of build.yml, of that
# version, the package of android signed with the key of the secrets; the
# program for Linux on x86_64 and on arm64, built here only; a release of
# GitHub with the package and the programs for Windows and Linux, its tag the
# version; and the site of the browser on GitHub Pages.
#
# A second push of a day takes the place of the release of that day: the
# release and its tag are deleted and made again on the new commit. A push
# while a release runs cancels it; the later push is released.
#
# The repository needs, once: the four secrets that build.yml names; and
# GitHub Actions as the source of its Pages (Settings, Pages).

name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: the day of the push, in UTC
        id: version
        run: echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: [version, checks]
    uses: ./.github/workflows/build.yml
    with:
      signed: true
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # `make build` on a runner of each architecture, in Debian 12: the program
  # needs the glibc it was built with or a newer one, and Debian 12 has 2.36,
  # as Raspberry Pi OS of it has, where Ubuntu 24.04 of the runner has 2.39.
  # It links only libc; the window loads X11 and Wayland when it starts. An
  # archive keeps the mode of the program, which an artifact loses.
  linux:
    needs: [version, checks]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: rust:bookworm
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: make VERSION=${{ needs.version.outputs.version }}
      - run: make build
      - name: the program in an archive
        run: tar -czf obusina-linux-${{ matrix.arch }}.tar.gz -C target/release obusina
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: obusina-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: built
      - name: the files of the release, named by the version
        run: |
          mkdir release
          cp built/android/obusina-release.apk "release/obusina-$VERSION.apk"
          cp built/windows/obusina.exe "release/obusina-$VERSION-windows-x86_64.exe"
          for arch in x86_64 arm64; do
            cp "built/linux-$arch/obusina-linux-$arch.tar.gz" \
              "release/obusina-$VERSION-linux-$arch.tar.gz"
          done
      - name: the release of the same day goes, with its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release delete "$VERSION" --cleanup-tag --yes
          fi
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$VERSION" > /dev/null 2>&1 || true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Obusina ${{ env.VERSION }}
          files: release/*
          fail_on_unmatched_files: true

  pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
